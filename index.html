<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>AI Workspace</h1>
    <span class="topbar-note">Runs in your browser. No account, no backend.</span>
  </header>

  <main class="layout">

    <!-- Left: what you send -->
    <section class="panel request" aria-label="Request">

      <div class="field">
        <label for="api-key">API key</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </div>

      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>

      <div class="field field-grow">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Write your request here"></textarea>
      </div>

      <button id="run" type="button" class="run">RUN</button>

      <p class="privacy">
        Your API key stays in this page's memory. It is sent only to the API provider when you press RUN,
        and it is forgotten when you close or reload the page.
      </p>

    </section>

    <!-- Right: what comes back -->
    <section class="panel result" aria-label="Result">

      <div class="result-body">
        <h2>Response</h2>
        <div id="response" class="response is-empty" aria-live="polite">The response will appear here.</div>
      </div>

      <div class="usage">
        <h2>Usage</h2>
        <dl class="usage-numbers">
          <div><dt>Input</dt><dd id="usage-input">–</dd></div>
          <div><dt>Output</dt><dd id="usage-output">–</dd></div>
          <div><dt>Total</dt><dd id="usage-total">–</dd></div>
        </dl>
        <p id="usage-extra" class="usage-extra"></p>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
